title: Practice & Learn AI
description: Free hands-on labs for building with AI, from a first model call to an assistant you can hand to a customer. By Flisk.
url: https://practice.flisk.si
baseurl: ""
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - scripts/
  - schemas/
  - content/
  - spec.md
  - openspec/
