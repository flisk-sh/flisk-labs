id: 01-installed
title: Is Flisk installed?
track: foundations
level: beginner
duration_min: 5
mode: guide
goal: "Check that the Flisk CLI is on your PATH and that your machine can run a local stack."
build: A machine that passes flisk doctor, ready for the next lab.
needs:
  - Node.js 20 or newer
  - Docker Desktop, Colima or OrbStack (only for container stacks)
docs:
  - label: Flisk quickstart
    url: https://flisk.sh/docs/quickstart/
steps:
  - id: version
    task: Install the CLI and print its version
    explain: Install it once with npm install -g @flisk-sh/flisk. Every later lab assumes this command works.
    cmd: flisk --version
    expect: A version number such as 1.4.61 prints.
    files: []
  - id: doctor
    task: Check your machine
    explain: Doctor checks Docker, Tilt, free ports and your project. It does not check any cloud cluster.
    cmd: flisk doctor
    expect: Each check shows a green tick. A red line names what is missing and the command that fixes it; run that and try again.
    files: []
