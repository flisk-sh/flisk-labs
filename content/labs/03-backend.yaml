id: 03-backend
title: Add a backend resource
track: first-service
level: beginner
duration_min: 10
mode: guide
goal: "Add your first backend service to the project and see Flisk pick it up."
build: An api service in services/pre-alpha/api, counted in flisk status.
needs:
  - The project from Lab 02
docs:
  - label: Flisk quickstart
    url: https://flisk.sh/docs/quickstart/
steps:
  - id: resource
    task: Add a backend called api
    explain: A resource is one service. Flisk writes its service.json for you, so you never hand-write container files.
    cmd: flisk resource api --type backend --stack pre-alpha --path services/pre-alpha/api --yes
    expect: Flisk says the api resource was created, and services/pre-alpha/api holds a service.json.
    files: []
  - id: list
    task: Check that Flisk sees it
    cmd: flisk status
    expect: "Stacks shows pre-alpha: 1 resource. Services stay stopped until you run flisk up pre-alpha."
    files: []
