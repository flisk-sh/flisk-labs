id: 10-local-model
title: Run a model on your laptop
track: models
level: beginner
duration_min: 15
mode: guide
goal: "Run a small open model on your own machine and call it two ways: from the terminal and over HTTP."
build: A local model that answers on http://localhost:11434, with no account and no bill.
needs:
  - Ollama
  - About 3 GB of free disk
docs:
  - label: Ollama docs
    url: https://docs.ollama.com
steps:
  - id: pull
    task: Install Ollama and pull a small model
    explain: llama3.2 (3B) runs on a laptop CPU. Lab 12 measures whether a bigger model is worth it. To use another model, set LAB_MODEL first, for example `export LAB_MODEL=smollm2:135m` on a small machine.
    cmd: "command -v ollama >/dev/null || { command -v zstd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }; curl -fsSL https://ollama.com/install.sh | sudo sh; }; (ollama serve >/dev/null 2>&1 &); sleep 4; M=${LAB_MODEL:-llama3.2}; ollama pull $M && ollama list"
    expect: The list shows your model (llama3.2 is about 2 GB; smollm2:135m about 270 MB).
    files: []
  - id: ask
    task: Ask it one question from the terminal
    cmd: "M=${LAB_MODEL:-llama3.2}; ollama run $M \"In one sentence, what is a token?\" | cat"
    expect: One sentence prints and you get your prompt back.
    files: []
  - id: http
    task: Call the same model over HTTP
    explain: Most hosted model APIs accept this same OpenAI-style request.
    cmd: "M=${LAB_MODEL:-llama3.2}; curl -s http://localhost:11434/v1/chat/completions -H 'Content-Type: application/json' -d \"{\\\"model\\\":\\\"$M\\\",\\\"messages\\\":[{\\\"role\\\":\\\"user\\\",\\\"content\\\":\\\"Say hi in three words.\\\"}]}\""
    expect: JSON comes back with the answer under choices[0].message.content and a usage block that counts prompt and completion tokens.
    files: []
