id: 02-scaffold
title: Scaffold a project
track: foundations
level: beginner
duration_min: 8
mode: guide
goal: "Create a new Flisk project in an empty folder."
build: A project folder that Flisk recognises, ready for its first service.
needs:
  - The Flisk CLI from Lab 01
  - An empty folder
docs:
  - label: Flisk quickstart
    url: https://flisk.sh/docs/quickstart/
steps:
  - id: folder
    task: Make an empty folder and go into it
    cmd: mkdir my-app && cd my-app
    expect: Your prompt now ends in my-app.
    files: []
  - id: project
    task: Create the project
    explain: --yes accepts the defaults, so nothing asks you questions.
    cmd: flisk project --yes
    expect: Flisk says the project was created, and ls shows package.json, AGENTS.md and a services folder.
    files: []
